[workspace]
members = [
    "crates/viewflow-protocol",
    "crates/viewflow-core",
    "crates/viewflow-deployment-marker",
    "crates/viewflow-platform",
    "crates/viewflow-hyprland",
    "crates/viewflow-transport",
    "crates/viewflowd",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

# Numerical FEC kernels must remain fast in dev/test too: unoptimized RS decode
# can block the media receive pump for tens of milliseconds per encoded frame.
[profile.dev.package.reed-solomon-simd]
opt-level = 3
