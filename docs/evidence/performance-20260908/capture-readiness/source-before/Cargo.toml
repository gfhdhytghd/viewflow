[package]
name = "viewflowd"
default-run = "viewflowd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
socket2 = "0.6.5"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1.0.104"
bytes = "1.11.1"
prost = "0.13"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "io-util", "process"] }
viewflow-platform = { path = "../viewflow-platform" }
viewflow-core = { path = "../viewflow-core" }
viewflow-protocol = { path = "../viewflow-protocol" }
viewflow-transport = { path = "../viewflow-transport" }

[features]
native-nvenc = []
native-gpu-nvenc = ["native-nvenc"]

[build-dependencies]
cc = "1.4.4"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1.53.1", features = ["fs"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_RemoteDesktop",
    "Win32_System_Pipes",
    "Win32_System_Performance",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
viewflow-hyprland = { path = "../viewflow-hyprland" }
nix = { version = "0.29", features = ["time"] }

[lints]
workspace = true
