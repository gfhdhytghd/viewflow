[package]
name = "viewflow-hyprland"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
viewflow-platform = { path = "../viewflow-platform" }
viewflow-protocol = { path = "../viewflow-protocol" }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["socket", "user", "fs"] }
