# Install as viewflow-desktop.service.d/99-windows-session.conf after installing
# both peers and their matching desktop-source/windows-input-source configs.
[Service]
Environment=VIEWFLOW_CURSOR_RAW_TOUCHPAD=1
ExecStart=
ExecStart=/usr/bin/python3 %h/data/viewflow/tools/desktop-autostart-linux.py --config %h/.config/viewflow/desktop-source.json --monitor DP-4 --peer %h/.local/lib/viewflow/desktop/vf-media-peer-main --existing-output HEADLESS-1 --fallback-config %h/.config/viewflow/windows-input-source.json --fallback-peer %h/.local/lib/viewflow/input/vf-cursor-peer
