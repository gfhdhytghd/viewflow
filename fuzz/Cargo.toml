[package]
name = "viewflow-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1.11.1"
libfuzzer-sys = "0.4"
prost = "0.13.5"
viewflow-deployment-marker = { path = "../crates/viewflow-deployment-marker" }
viewflow-hyprland = { path = "../crates/viewflow-hyprland" }
viewflow-platform = { path = "../crates/viewflow-platform", features = ["fuzzing"] }
viewflow-protocol = { path = "../crates/viewflow-protocol" }
viewflow-transport = { path = "../crates/viewflow-transport", features = ["fuzzing"] }
viewflowd = { path = "../crates/viewflowd", features = ["fuzzing"] }

# Kept out of the main workspace so nightly/sanitizer builds never affect it.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "sidecar_request"
path = "fuzz_targets/sidecar_request.rs"
test = false
doc = false
bench = false

