[package]
name = "viewflow-native-proxy-probe"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace]

[lib]
name = "viewflow_platform"
path = "lib.rs"

[[bin]]
name = "proxy_smoke"
path = "../../crates/viewflow-platform/examples/proxy_smoke.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
