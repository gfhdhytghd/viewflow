name: macOS native backends
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Check portable daemon
        run: cargo +stable check --locked -p viewflowd --lib --bins
      - name: Test portable foundation
        run: cargo +stable test --locked -p viewflow-protocol -p viewflow-core -p viewflow-platform -p viewflow-transport
      - name: Test input receiver without posting desktop events
        run: cargo +stable test --locked -p viewflowd --lib input_runtime::
      - name: Test window bridge without desktop events
        run: cargo +stable test --locked -p viewflowd --bin vf-window-peer --test window_bridge_quic
      - name: Build native backends for Apple Silicon and Intel
        run: cmake -S platform/macos -B build/macos -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" && cmake --build build/macos
      - name: Check native codecs and CLI without desktop permissions
        run: ctest --test-dir build/macos --output-on-failure
      - name: Build unified macOS app (explicit development build without HID)
        run: python3 tools/build-macos-app.py --without-driver --output dist/Viewflow-Development-No-HID.app --zip
      - name: Upload macOS development artifact (HID activation not verified)
        uses: actions/upload-artifact@v4
        with:
          name: Viewflow-macOS-Development-No-HID
          path: dist/Viewflow-Development-No-HID.zip
