name: Cross-platform clipboard
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clipboard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build portable clipboard peer
        run: cargo +stable build --locked -p viewflowd --bin vf-clipboard-peer
      - name: Test clipboard protocol and synchronization without desktop access
        run: cargo +stable test --locked -p viewflowd --lib clipboard_sync::
